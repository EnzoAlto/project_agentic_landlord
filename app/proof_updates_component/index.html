<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;font:13px system-ui;color:#64748b">
<span id="status" role="status">Connecting to payment updates…</span>
<script>
(() => {
  let config, controller, retryTimer, debounceTimer, lastRevision = '', pendingRevision = '';
  let activeSignature = '', retryDelay = 1000, generation = 0;
  let pageHidden = false, visibilityPaused = document.hidden, resumeSequence = 0;
  const statusElement = document.getElementById('status');
  const post = (type, fields = {}) => parent.postMessage({isStreamlitMessage:true, type, ...fields}, '*');
  const emit = (value) => post('streamlit:setComponentValue', {value, dataType:'json'});
  function status(text) { statusElement.textContent = text; }
  function canConnect() { return config?.enabled && !document.hidden && !pageHidden; }
  function disconnect() {
    generation++;
    controller?.abort();
    controller = null;
    clearTimeout(retryTimer);
    clearTimeout(debounceTimer);
    pendingRevision = '';
  }
  function notify(revision) {
    if (!revision || revision === lastRevision || revision === pendingRevision) return;
    pendingRevision = revision;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      if (!canConnect()) return;
      lastRevision = pendingRevision;
      pendingRevision = '';
      emit({revision:lastRevision, status:'updated'});
      status('Live payment updates connected');
    }, 3000);
  }
  async function connect() {
    if (!canConnect()) return;
    const connectionGeneration = ++generation;
    const connectionConfig = config;
    const connectionController = new AbortController();
    controller = connectionController;
    const current = () => connectionGeneration === generation && canConnect();
    try {
      const response = await fetch(connectionConfig.url, {headers:{Authorization:`Bearer ${connectionConfig.token}`}, signal:connectionController.signal});
      if (!current()) return;
      if (response.status === 401) {
        status('Reconnecting payment updates…');
        emit({revision:lastRevision, status:'expired', expires:connectionConfig.expires});
        return;
      }
      if (!response.ok || !response.body) throw new Error('Connection unavailable');
      retryDelay = 1000;
      status('Live payment updates connected');
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const {done, value} = await reader.read();
        if (done || !current()) break;
        buffer += decoder.decode(value, {stream:true});
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
          const line = block.split('\n').find(line => line.startsWith('data: '));
          if (line) notify(JSON.parse(line.slice(6)).revision);
        }
      }
    } catch (error) {
      if (error.name === 'AbortError' || !current()) return;
      status('Live updates reconnecting. You can also use Refresh submissions.');
    }
    if (current()) {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    }
  }
  function visibilityChanged() {
    if (document.hidden || pageHidden) {
      visibilityPaused = true;
      disconnect();
      status(config?.enabled ? 'Live updates paused while this page is hidden' : 'Live payment updates paused');
    } else if (visibilityPaused) {
      visibilityPaused = false;
      if (!config?.enabled) return;
      retryDelay = 1000;
      // Component values rerun only this submission fragment. Refresh even
      // when no proof event occurred: approvals/deletions do not publish one.
      emit({revision:lastRevision, status:'resumed', resume:++resumeSequence});
      status('Refreshing payment updates…');
      connect();
    }
  }
  addEventListener('message', event => {
    if (event.source !== parent || event.data.type !== 'streamlit:render') return;
    const next = event.data.args;
    const signature = JSON.stringify([next.enabled, next.url, next.token]);
    if (signature === activeSignature) return;
    activeSignature = signature;
    disconnect();
    config = next;
    if (!lastRevision) lastRevision = next.revision || '';
    visibilityPaused = document.hidden || pageHidden;
    if (canConnect()) connect();
    else status(next.enabled ? 'Live updates paused while this page is hidden' : 'Live payment updates paused');
    post('streamlit:setFrameHeight', {height:32});
  });
  document.addEventListener('visibilitychange', visibilityChanged);
  addEventListener('pagehide', () => {pageHidden = true; visibilityChanged();});
  addEventListener('pageshow', () => {pageHidden = false; visibilityChanged();});
  post('streamlit:componentReady', {apiVersion:1});
  post('streamlit:setFrameHeight', {height:32});
})();
</script></body></html>
